name: NetGuard IaC Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  netguard-scan:
    name: NetGuard Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed IaC files
        id: collect
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}"...HEAD | grep -E '\.(tf|yaml|yml)$' || true)
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Verify NetGuard API is reachable
        if: steps.collect.outputs.changed_files != ''
        run: |
          API="${NETGUARD_API_URL%/}"
          API="${API%/api}"
          curl -sf -H 'ngrok-skip-browser-warning: 1' "$API/health" \
            || { echo "::error::Cannot reach $API/health — is the API running and ngrok forwarding to port 8000?"; exit 1; }
        env:
          NETGUARD_API_URL: ${{ secrets.NETGUARD_API_URL }}

      - name: Run NetGuard scan
        id: scan
        if: steps.collect.outputs.changed_files != ''
        run: python scripts/post_pr_findings.py
        env:
          CHANGED_FILES: ${{ steps.collect.outputs.changed_files }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          NETGUARD_API_URL: ${{ secrets.NETGUARD_API_URL }}
          NETGUARD_SECRET: ${{ secrets.NETGUARD_SECRET }}

      - name: Post PR comment
        if: steps.collect.outputs.changed_files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.scan.outputs.comment_body }}`
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            })

      - name: Enforce merge blocking
        if: steps.collect.outputs.changed_files != ''
        run: |
          if [ "${{ steps.scan.outputs.blocking }}" = "true" ]; then
            echo "NetGuard blocking merge due to non-overridden critical findings."
            exit 1
          fi
          echo "No blocking critical findings."
        env:
          NETGUARD_API_URL: ${{ secrets.NETGUARD_API_URL }}
