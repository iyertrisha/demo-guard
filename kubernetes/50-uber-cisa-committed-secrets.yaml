# Mixed breach patterns: Uber 2022 (hard-coded creds in automation) and public-repo K8s secret leaks
# (e.g. CISA-adjacent "external-secret-repo-creds.yaml" style filenames in 2025 disclosures).
# Values are fake demo placeholders — never commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: external-secret-repo-creds
  namespace: demo-guard
  labels:
    breach.ref: uber-2022-hardcoded-creds,cisa-repo-leak-pattern
  annotations:
    netguard.demo/warning: committed-to-git-plain-base64-not-encryption
type: Opaque
stringData:
  github_pat: ghp_DEMO_ONLY_REPLACE_IN_CI_NOT_REAL
  pam_admin_password: UberStyleHardcodedPamPassword-DEMO
  aws_access_key_id: AKIADEMO000000000000
  aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-automation-script
  namespace: demo-guard
  labels:
    breach.ref: uber-2022-powershell-network-share
data:
  run-backup.ps1: |
    # Anti-pattern from Uber breach reporting: privileged PAM credentials embedded in script
    # on a broadly readable internal share (PowerShell automation).
    $PAM_USER = "svc-pam-admin"
    $PAM_PASS = "HardcodedPamPasswordFromNetworkShare-DEMO"
    Connect-PAMVault -Username $PAM_USER -Password $PAM_PASS
