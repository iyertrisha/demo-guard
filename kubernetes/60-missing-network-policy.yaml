# HIGH — namespace workload with no NetworkPolicy (NetGuard Rule 7).
apiVersion: v1
kind: Pod
metadata:
  name: unprotected-api
  namespace: demo-guard
  labels:
    app: unprotected-api
    breach.ref: missing-network-policy
spec:
  containers:
    - name: api
      image: nginx:alpine
      ports:
        - containerPort: 8080
